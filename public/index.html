<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>👩‍💻 DevConnect – Developer Directory</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f9fafb;
        font-family: "Poppins", sans-serif;
      }

      nav {
        background: linear-gradient(90deg, #0d6efd, #6610f2);
      }

      .card {
        border-radius: 10px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
      }

      #search {
        border-radius: 8px;
        border: 1px solid #ccc;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      }

      #search:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 5px rgba(13, 110, 253, 0.4);
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark mb-4">
      <div class="container">
        <span class="navbar-brand mb-0 h1">👩‍💻 DevConnect</span>
      </div>
    </nav>

    <div class="container">
      <!-- Add Developer Form -->
      <div class="card p-4 mb-4">
        <h4 class="mb-3">Add New Developer</h4>
        <form id="devForm">
          <div class="row">
            <div class="col-md-4 mb-3">
              <input
                type="text"
                id="name"
                class="form-control"
                placeholder="Name"
                required
              />
            </div>
            <div class="col-md-4 mb-3">
              <input
                type="text"
                id="role"
                class="form-control"
                placeholder="Role"
                required
              />
            </div>
            <div class="col-md-4 mb-3">
              <input
                type="text"
                id="skills"
                class="form-control"
                placeholder="Skills"
                required
              />
            </div>
          </div>
          <button class="btn btn-primary w-100">Add Developer</button>
        </form>
      </div>

      <!-- 🔍 Search Bar -->
      <div class="card p-3 mb-4">
        <input
          type="text"
          id="search"
          class="form-control"
          placeholder="🔍 Search developer by name, role, or skills..."
        />
      </div>

      <!-- Developer Cards -->
      <div class="row" id="devList"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
